[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-kernels"
version = "0.2.0"
description = "Fused kernels for Intel Arc (Xe2) XPU tensors: ConvRot INT8, fused rms_norm+rope/adaLN, and the instruments used to verify them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["numpy"]

# [project.urls]  # add Homepage once the repository exists

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
xpu_kernels = ["*.so"]
"xpu_kernels.int8" = ["*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
