name: release

# Publishing, and only publishing: a tag push is the one act that ships. Nothing
# here runs on a branch push, so a release cannot go out by accident.
#
# PyPI is configured as a *trusted publisher*, not with an API token: the upload
# job asks GitHub for an OIDC token and PyPI checks its claims. That check is an
# exact string match on four fields, and a mismatch fails with "the publisher
# was not found" rather than anything readable. They are:
#
#   project     xpu-kernels
#   owner       okolenmi
#   repository  oko-xpu-kernels
#   workflow    release.yml          <- this filename, do not rename
#   environment pypi                 <- the `environment:` key below
#
# Two artifacts, one version:
#   * sdist on ubuntu-latest      -- installs with no toolchain; kernels missing
#   * wheel on the self-hosted     -- carries libxpuint8.so, needs oneAPI 2025.x
#     "xpu" runner
#
# The wheel is what makes `pip install xpu-kernels` actually compute, so it goes
# to PyPI as well as to the GitHub Release. It is tagged linux_x86_64, so other
# platforms simply fall back to the sdist. The version stays plain `0.2.0`
# because PyPI must not accept local versions (PEP 440) -- the toolchain lives
# in the tag and the release notes instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # twine check renders the README the way PyPI will; a broken relative link
      # has to fail here, because an uploaded version cannot be replaced.
      - name: Build and check the sdist
        env:
          PYTHON: python
        run: |
          python -m pip install --upgrade build twine
          ./wheel.sh --sdist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*

  wheel:
    runs-on: [self-hosted, xpu]
    steps:
      - uses: actions/checkout@v4

      - name: Build the wheel
        env:
          PYTHON: python
        run: ./wheel.sh

      # Same check as the test workflow: a wheel that cannot load its own .so
      # is worse than no wheel at all.
      - name: Install the wheel into a scratch prefix
        run: |
          pip install --no-deps --target "$RUNNER_TEMP/whl" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/whl" python - <<'PY'
          import xpu_kernels
          assert xpu_kernels.available(), "the wheel does not load its own .so"
          print(xpu_kernels.__file__, xpu_kernels.device_name())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*

  publish:
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # what trusted publishing exchanges for an upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # A tag that disagrees with pyproject.toml would publish one version and
      # label it another. Nothing after this point can be undone.
      - name: The tag is the version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} != pyproject version {version}"
          print("publishing", version)
          PY

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The same bytes PyPI just took, attached to the tag, so a consumer can
      # pin one file by URL without an index in between.
      - name: Attach the artifacts to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
