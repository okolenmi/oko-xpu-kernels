name: release

# Publishing, and only publishing: a tag push is the one act that ships. Nothing
# here runs on a branch push, so a release cannot go out by accident.
#
# PyPI is configured as a *trusted publisher*, not with an API token: the upload
# job asks GitHub for an OIDC token and PyPI checks its claims. That check is an
# exact string match on four fields, and a mismatch fails with "the publisher
# was not found" rather than anything readable. They are:
#
#   project     xpu-kernels
#   owner       okolenmi
#   repository  oko-xpu-kernels
#   workflow    release.yml          <- this filename, do not rename
#   environment pypi                 <- the `environment:` key below
#
# Two artifacts, one version:
#   * sdist -- installs anywhere with no toolchain; the kernels are missing
#   * wheel -- carries libxpuint8.so; needs a oneAPI 2025.x runtime to load
#
# The wheel is what makes `pip install xpu-kernels` actually compute, so it goes
# to PyPI as well as to the GitHub Release. It is tagged linux_x86_64, so other
# platforms simply fall back to the sdist. The version stays plain `0.2.0`
# because PyPI must not accept local versions (PEP 440) -- the toolchain lives
# in the tag and the release notes instead.
#
# The jobs run on a pinned image rather than ubuntu-latest, and that is not a
# detail: the wheel carries an ELF, and a wheel built against a newer glibc
# does not load on an older one.  The wheel job builds on ubuntu-22.04
# (glibc 2.35) because that is what the manylinux_2_35_x86_64 tag claims, and
# it checks the .so against that number.  ubuntu-latest migrates to Ubuntu
# 26.04 (glibc 2.4x) as of 2026-10-19, which would make the tag a lie.
#
# The wheel is built here, on a GitHub-hosted runner, and not on a self-hosted
# one: the .so needs a DPC++ compiler, and that compiler is a downloadable apt
# package, so the alternative was a runner daemon sitting on the maintainer's
# desktop (and a job that would otherwise queue forever -- there is no such
# runner registered). The toolchain version is pinned to the one this
# repository was verified with (2025.3.2), because the .so links libsvml and
# friends: a consumer with a different oneAPI patch release may not have the
# symbols. The pin is asserted below, so a toolchain that drifts fails the
# release instead of publishing a .so that cannot load.

on:
  push:
    tags: ["v*"]
  # A rehearsal: builds both artifacts, publishes nothing. The publish jobs are
  # gated on `github.ref_type == 'tag'`, so a manual run cannot upload.
  workflow_dispatch:

permissions:
  contents: read

env:
  ONEAPI_VERSION: 2025.3.2-832
  # The platform tag of the wheel.  PyPI refuses the plain "linux_x86_64" that
  # bdist_wheel produces ("unsupported platform tag"), so the tag is a
  # manylinux one, and it names the oldest glibc the payload may need.  The
  # wheel job builds on ubuntu-22.04 (glibc 2.35) and checks the .so against
  # this number, so the tag cannot drift away from the binary.
  XPUINT8_PLATFORM_TAG: manylinux_2_35_x86_64

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # twine check renders the README the way PyPI will; a broken relative link
      # has to fail here, because an uploaded version cannot be replaced.
      - name: Build and check the sdist
        env:
          PYTHON: python
        run: |
          python -m pip install --upgrade build twine
          ./wheel.sh --sdist
          python -m twine check dist/*

      # A tag that disagrees with pyproject.toml would publish one version and
      # label it another. This runs before anything is uploaded.
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.startswith("v"):
              tag = tag[1:]
          assert tag == version, f"tag {tag} != pyproject version {version}"
          print("version", version)
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*

  wheel:
    # glibc 2.35, because the wheel claims manylinux_2_35_x86_64.  Building on
    # a newer base would make the tag a lie and pip would install a wheel that
    # fails on the systems the tag claims to support.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The wheel is built with --no-build-isolation, so the build backend has
      # to be importable in this interpreter.  A 3.12 venv from the runner
      # image has no setuptools (ensurepip stopped shipping it), which is
      # exactly how the first run of this workflow died with
      # "Cannot import 'setuptools.build_meta'".
      - name: Install the build backend
        run: pip install "setuptools>=77"

      # The compiler is several GB installed; the runner ships a few GB of
      # toolchains this project will never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install the pinned oneAPI compiler
        run: |
          set -euo pipefail
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          # apt would otherwise pick the newest 2025.3.x, and the .so links
          # libsvml/libirng/libimf: a consumer with a different patch release may
          # not have the symbols. This pin is the reason the release fails
          # loudly rather than shipping a .so that cannot load.
          printf 'Package: intel-oneapi-*\nPin: version 2025.3.2-*\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/oneapi-pin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp-2025.3=${{ env.ONEAPI_VERSION }} \
            intel-oneapi-compiler-dpcpp-cpp-runtime-2025.3=${{ env.ONEAPI_VERSION }}
          # Find the compiler the way build.sh does, and refuse anything that is
          # not the pinned patch release.
          compiler=""
          for c in /opt/intel/oneapi/compiler/*/bin/icpx; do
            if "$c" --version 2>/dev/null | grep -q '2025\.3\.2'; then compiler="$c"; break; fi
          done
          test -n "$compiler" || {
            echo "no 2025.3.2 icpx after the install; what is there:"
            for c in /opt/intel/oneapi/compiler/*/bin/icpx; do "$c" --version | head -1; done
            exit 1
          }
          "$compiler" --version
          echo "SYCL_ROOT=$(dirname "$(dirname "$compiler")")" >> "$GITHUB_ENV"

      - name: Build the wheel
        env:
          PYTHON: python
        run: ./wheel.sh

      # There is no GPU on this runner, so the library cannot be initialised
      # here (xpuint8_init enumerates devices). What can be checked is that the
      # payload is where the loader looks for it, that it links the SYCL
      # runtime the consumer's torch provides, that it does not need a glibc
      # newer than the wheel's tag claims, and that the package imports and
      # reports "unavailable" instead of crashing.
      - name: The wheel carries a .so that links libsycl.so.8
        run: |
          set -euo pipefail
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps --target "$RUNNER_TEMP/whl" dist/*.whl
          so="$RUNNER_TEMP/whl/xpu_kernels/int8/libxpuint8.so"
          test -f "$so" || { echo "the wheel does not carry the .so where the loader looks"; exit 1; }
          readelf -d "$so" | grep -q 'libsycl\.so\.8' || { echo "the .so does not link libsycl.so.8"; exit 1; }

          # The tag is a promise about glibc; the .so must not need more.
          tag="$XPUINT8_PLATFORM_TAG"
          case "$tag" in manylinux_*) ;; *) echo "unexpected tag $tag"; exit 1;; esac
          want=$(echo "$tag" | sed -E 's/^manylinux_([0-9]+_[0-9]+)_.*/\1/' | tr '_' '.')   # 2.35
          need=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "the .so needs glibc $need; the wheel claims $want"
          python3 -c "import sys; sys.exit(0 if tuple(map(int, '$need'.split('.'))) <= tuple(map(int, '$want'.split('.'))) else 1)" \
            || { echo "the .so needs glibc $need but the tag claims $want"; exit 1; }

          # And the file itself must carry the tag, or PyPI will refuse it.
          ls dist/*.whl | grep -q "$tag" || { echo "the wheel is not tagged $tag"; ls -1 dist; exit 1; }

          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/whl" python - <<'PY'
          import xpu_kernels
          print(xpu_kernels.__version__, "available:", xpu_kernels.available())
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheel
          path: dist/*

  publish-sdist:
    needs: [sdist]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write       # what trusted publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A re-run after a partial failure must not choke on the file that
          # already went up.
          skip-existing: true

  publish-wheel:
    needs: [sdist, wheel]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-wheel
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    needs: [publish-sdist, publish-wheel]
    if: always() && github.ref_type == 'tag' && needs.publish-sdist.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: dist/sdist

      - uses: actions/download-artifact@v7
        continue-on-error: true      # a failed wheel job must not lose the sdist
        with:
          name: dist-wheel
          path: dist/wheel

      # The same bytes PyPI just took, attached to the tag, so a consumer can
      # pin one file by URL without an index in between.
      #
      # The GitHub API is called directly rather than through `gh`: the CLI has
      # to work out the repository from the checkout, and a failed release is
      # not worth a guess. The response body is printed on every error, which
      # the CLI version did not do.
      - name: Attach the artifacts to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"

          code=$(curl -sS -o /tmp/release.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases" \
            -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"generate_release_notes\":true}")
          if [[ "$code" == "422" ]]; then          # it already exists
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/releases/tags/$tag" -o /tmp/release.json
          elif [[ "$code" != "201" ]]; then
            echo "creating the release failed: HTTP $code"
            cat /tmp/release.json
            exit 1
          fi
          upload_url=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["upload_url"])')
          upload_url="${upload_url%\?*}"

          for f in dist/sdist/* dist/wheel/*; do
            [[ -f "$f" ]] || continue
            echo "uploading $f"
            code=$(curl -sS -o /tmp/asset.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$upload_url?name=$(basename "$f")")
            if [[ "$code" != "201" && "$code" != "422" ]]; then
              echo "upload failed: HTTP $code"
              cat /tmp/asset.json
              exit 1
            fi
          done
