name: tests

# The CPU job is the contract: every reference formula, every gate rule and the
# backward gradchecks run on a machine with no XPU and no libxpuint8.so. That is
# deliberate -- those are the parts that can be wrong in a way the GPU would
# only report as "the image changed", and they must be checkable anywhere.
#
# The device job needs a self-hosted runner labelled "xpu" with oneAPI and a
# built libxpuint8.so (see build.sh). It is skipped unless the repository
# variable XPU_RUNNER is set to "yes", so a fork or a fresh clone does not sit
# with a permanently queued job.

on:
  push:
  pull_request:

jobs:
  cpu:
    # Pinned rather than ubuntu-latest: the label migrates to Ubuntu 26.04
    # (2026-10-19), and a moving image makes a green run mean something
    # different every month.  This job produces no binary, so the image choice
    # only has to be stable.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # CPU torch, from the CPU index: the default wheel pulls ~2 GB of CUDA
      # libraries this project will never load.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and pytest
        run: pip install -e . --no-deps && pip install pytest

      # No libxpuint8.so here: available() is False and the INT8 half reports
      # itself unavailable, which must not break the import.
      - name: Import without the native library
        run: python -c "import xpu_kernels as k; assert not k.available(); print(k.__version__ if hasattr(k, '__version__') else 'ok')"

      - name: Tests
        run: python -m pytest -q

  device:
    if: vars.XPU_RUNNER == 'yes'
    runs-on: [self-hosted, xpu]
    steps:
      - uses: actions/checkout@v5

      - name: Build libxpuint8.so
        run: ./build.sh

      # The package is not importable from the repo root without this (it lives
      # in python/), and the wheel build below needs the same metadata.
      - name: Install the package
        run: pip install -e . --no-deps && pip install pytest

      # The wheel below is built with --no-build-isolation, so the build
      # backend has to be importable in the interpreter that runs pip.
      - name: Install the build backend
        run: pip install "setuptools>=77"

      # The self-test is the whole point: it probes every gate against its
      # reference on this machine, so an upgrade that moves a value fails here
      # instead of changing a render.
      - name: Self-test and gates
        env:
          LEVEL_ZERO_V1_SDK_PATH: ${{ vars.LEVEL_ZERO_V1_SDK_PATH }}
        run: python -m xpu_kernels

      - name: CPU-side tests on the XPU machine too
        run: python -m pytest -q

      # The wheel is the artefact another project installs; it is built here
      # because the .so has to come from a machine with oneAPI 2025.x, and
      # installed again from a scratch prefix so a missing package-data entry or
      # a wrong wheel tag fails here instead of at somebody's `pip install`.
      - name: Wheel with libxpuint8.so
        env:
          PYTHON: python
        run: ./wheel.sh

      - name: Install the wheel into a scratch prefix
        run: |
          pip install --no-deps --target "$RUNNER_TEMP/whl" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/whl" python - <<'PY'
          import xpu_kernels
          assert xpu_kernels.available(), "the wheel does not load its own .so"
          print(xpu_kernels.__file__, xpu_kernels.device_name())
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: xpu-kernels-wheel
          path: dist/*.whl
